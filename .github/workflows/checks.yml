# Runs the site checks on every push and pull request: every page published (and the two native guides in step with
# their data), no link back to a private
# artifact, every link between pages resolving, no email address, no retired names, the colophon on every page.
# Then proves each check fails on a deliberate break. Free; no secrets; read-only.
name: Checks
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install ruff==0.17.5 && ruff check tools
      # C9 rebuilds the guides, whose colophon draws the QR code and barcode: the same pinned packages publish.py uses.
      - run: pip install segno==1.6.6 python-barcode==0.16.1
      - run: python tools/check.py
      - run: python tools/check.py --negative
